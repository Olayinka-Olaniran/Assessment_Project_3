<!DOCTYPE html>

<html>

<head>

    <title>UTILITY CALCULATOR PROJECT</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="WeeklyAssessment3.css">

</head>

<body>

    <button id="menuToggle">☰ </button>
    <section id="content">

        <div id="side-menu" >

           <a href=""><p>Menu Item 1</p></a><br>
           <a href=""><p>Menu Item 2</p></a><br>
           <a href=""><p>Menu Item 3</p></a><br>

                

        </div>

        </section>

        <div id="positioning">
    <h1>
      Utility Calculator
    </h1>

        
        <div class="grid">
            <p id="screen"></p>
            <button class="item1">1</button>
            <button class="item2">2</button>
            <button class="item3">3</button>
            <button class="item4">4</button>
            <button class="item5">5</button>
            <button class="item6">6</button>
            <button class="item7">7</button>
            <button class="item8">8</button>
            <button class="item9">9</button>
            <button class="item10">0</button>
            <button class="itemAdd">+</button>
            <button class="itemSubtract">-</button>
            <button class="itemMultiply">×</button>
            <button class="itemDivide">÷</button>
            <button class="itemBMICalculation">BMI</button>
            <button class="itemSolve">=</button>
            <button class="itemClear">Clear</button>
        </div>

        <dialog id = "modal">
        <form onsubmit="generate(event)">

            <div id="close">
            <button id="closeWindow" type="button">X</button>
            </div>

            <div id = "Weight">
                <label for="weight">Weight(kg):</label>
                <input type="text" id="weight" required><br><br>           
            </div>
             <div id = "Height">
                <label for="height">Height(m):</label>
                <input type="text" id="height" required><br><br>           
            </div>
        

            <div id="Calculate">
            <button id="calculateBMI" type="submit">Calculate</button>
            </div>

        </form>
        </dialog>

        </div>

        <script src="WeeklyAssessment3.js"></script>
</body>

</html>
